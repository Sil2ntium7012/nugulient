name: Build Nugulient

# ■ 유저에게 배포(릴리스): Actions > Build Nugulient > Run workflow > Run workflow
#   - 버전은 알아서 올라가요. 아직 한 번도 안 올린 버전이면 그대로(처음은 1.0.0),
#     이미 올린 버전이면 끝자리를 하나 올려요 (1.0.0 → 1.0.1 → 1.0.2 …)
#   - Releases 에 v버전으로 Nugulient-Setup.exe · latest.yml 이 올라가고,
#     이미 설치한 사람들은 자동으로 업데이트돼요.
#   - 올린 버전은 package.json 에도 자동으로 저장돼요.
# ■ main 에 코드만 올리면: 설치 파일만 만들어서 Actions > Artifacts 에 둠 (테스트용, 배포 안 됨)

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: build-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 버전 정하기 (릴리스할 때만)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          git fetch --tags --force
          cur=$(node -p "require('./package.json').version")
          next="$cur"
          # 이미 릴리스한 버전이면 끝자리 +1 (빈 번호가 나올 때까지)
          while git rev-parse -q --verify "refs/tags/v$next" >/dev/null; do
            next=$(node -e "const v=process.argv[1].split('.').map(Number);v[2]++;console.log(v.join('.'))" "$next")
          done
          echo "이번 릴리스 버전: $next (package.json 은 $cur)"
          npm version "$next" --no-git-tag-version --allow-same-version
          echo "VERSION=$next" >> "$GITHUB_ENV"

      - run: npm install

      - name: 설치 파일 빌드 (테스트용)
        if: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run dist:win

      - name: 설치 파일 빌드 + Releases 에 올리기
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
        run: npm run dist:win:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 올린 버전을 package.json 에 저장
        if: ${{ github.event_name == 'workflow_dispatch' && success() }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then echo "버전 그대로"; exit 0; fi
          git commit -m "v$VERSION 릴리스 [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        with:
          name: Nugulient-Setup
          path: dist/*.exe
