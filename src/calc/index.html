<!doctype html>
<html lang="ko" data-theme="black">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://mcng.kr data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self'">
  <title>계산기</title>
  <script src="bridge.js"></script>
  <style>@font-face{font-family:"SUIT";src:url("../fonts/SUIT-Regular.woff2") format("woff2");font-weight:400}@font-face{font-family:"SUIT";src:url("../fonts/SUIT-SemiBold.woff2") format("woff2");font-weight:600}@font-face{font-family:"SUIT";src:url("../fonts/SUIT-Bold.woff2") format("woff2");font-weight:700}@font-face{font-family:"SUIT";src:url("../fonts/SUIT-ExtraBold.woff2") format("woff2");font-weight:800}</style>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="embed.css">
</head>
<body>
  <header class="titlebar">
    <div class="brand">
      <span class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
      <b>N<span class="star">✦</span>VA</b><span class="brand-sub">CALCULATOR</span><span class="ver" id="appVer"></span>
    </div>
    <div class="title-center"><span class="pill" id="datePill">시세 불러오는 중…</span></div>
    <div class="title-right">
      <div class="theme-dots" role="radiogroup" aria-label="테마">
        <button data-theme-set="white" title="화이트" aria-label="화이트 테마"></button>
        <button data-theme-set="gray" title="그레이" aria-label="그레이 테마"></button>
        <button data-theme-set="black" title="블랙" aria-label="블랙 테마"></button>
      </div>
      <div class="win-ctrl">
        <button data-win="min" aria-label="최소화"><svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg></button>
        <button data-win="max" aria-label="최대화"><svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" rx="1.5"/></svg></button>
        <button data-win="close" class="close" aria-label="닫기"><svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6"/></svg></button>
      </div>
    </div>
  </header>

  <div class="shell">
    <nav class="side">
      <button class="nav" data-page="market" title="시세">
        <svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16"/><path d="M7 15l4-4 3 3 5-6"/></svg><span>시세</span>
      </button>
      <button class="nav" data-page="trade" title="무역">
        <svg viewBox="0 0 24 24"><path d="M3 17l2 3h14l2-3"/><path d="M5 17V12l7-3 7 3v5"/><path d="M12 9V3M12 3l4 2-4 2"/></svg><span>무역</span>
      </button>
      <button class="nav" data-page="cook" title="요리">
        <svg viewBox="0 0 24 24"><path d="M4 11h16v2a7 7 0 0 1-7 7h-2a7 7 0 0 1-7-7v-2z"/><path d="M9 7c0-1.5 1-2 1-3.5M13 7c0-1.5 1-2 1-3.5"/></svg><span>요리</span>
      </button>
      <div class="side-gap"></div>
      <button class="nav" data-page="settings" title="설정">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>설정</span>
      </button>
    </nav>

    <main class="main" id="main"></main>

    <aside class="right">
      <section class="card status-card">
        <div class="status-row">
          <span class="dot" id="statusDot"></span>
          <div>
            <div class="status-title" id="statusTitle">시세 확인 중</div>
            <div class="status-sub" id="statusSub">—</div>
          </div>
          <button class="icon-btn" id="refreshBtn" title="지금 새로고침" aria-label="지금 새로고침">
            <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
          </button>
        </div>
        <div class="next-refresh">
          <span>다음 자동 갱신</span><b id="countdown">--:--:--</b>
        </div>
      </section>

      <section class="card calc" id="calc">
        <div class="calc-head">
          <h3>계산기</h3>
          <button class="ghost-btn sm" id="calcCopy" title="결과 복사">복사</button>
        </div>
        <div class="calc-screen">
          <div class="calc-hist" id="calcHist"></div>
          <input class="calc-expr" id="calcExpr" spellcheck="false" autocomplete="off" placeholder="0" aria-label="수식">
          <div class="calc-result" id="calcResult">0</div>
          <div class="calc-units" id="calcUnits">0개</div>
        </div>
        <div class="calc-chips">
          <button data-c="×64">×세트</button>
          <button data-c="×3456">×상자</button>
          <button data-c="÷64">÷64</button>
          <button data-c="×1.1">청동</button>
          <button data-c="×1.2">은</button>
          <button data-c="×1.3">금</button>
        </div>
        <div class="calc-keys">
          <button data-k="C" class="fn">C</button><button data-k="(" class="fn">(</button><button data-k=")" class="fn">)</button><button data-k="÷" class="op">÷</button>
          <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button data-k="×" class="op">×</button>
          <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button data-k="−" class="op">−</button>
          <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="+" class="op">+</button>
          <button data-k="⌫" class="fn">⌫</button><button data-k="0">0</button><button data-k=".">.</button><button data-k="=" class="eq">=</button>
        </div>
      </section>
    </aside>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
